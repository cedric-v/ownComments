<!-- Comment Section -->
<h3>Ajouter un commentaire</h3>
<form id="comment-form">
  <input type="text" id="name" placeholder="Votre pr&eacute;nom" required /><br />
  <textarea id="text" placeholder="Votre commentaire" required></textarea><br />
  <button type="submit">Envoyer</button>
</form>
<div id="comments-container"></div>
<div id="pagination-controls" style="margin-top:10px;"></div>

<!-- Firebase App + Firestore (compat SDK, dernière version disponible : 9.23.0) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- Script principal -->
<script>
var firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "your-project.firebaseapp.com",
    projectId: "your-project",
    storageBucket: "your-project.appspot.com",
    messagingSenderId: "...",
    appId: "..."
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();
var pageId = encodeURIComponent(window.location.origin + window.location['pathname']);
var COMMENTS_PER_PAGE = 20;

// ---- Pagination côté serveur (limit + startAfter) ----
// Les commentaires sont chargés page par page depuis Firestore
// (pas de chargement de toute la collection en mémoire).
var currentPage = 1;
var totalComments = null;   // null tant que le count() n'a pas répondu
var pagesCache = {};        // page -> { docs: [...], lastDoc: DocumentSnapshot|null }

function commentsQuery() {
  return db.collection("comments").doc(pageId).collection("messages")
    .orderBy("timestamp", "desc");
}

// Comptage total (agrégat Firestore) pour afficher "Page X / Y"
function loadTotalComments() {
  if (totalComments !== null) return;
  var col = db.collection("comments").doc(pageId).collection("messages");
  if (typeof col.count !== "function") return; // ancien SDK : on affiche sans total
  col.count().get().then(function (snap) {
    totalComments = snap.data().count;
    renderPaginationControls(currentPage);
  }).catch(function (err) {
    console.error("Erreur count Firestore :", err);
  });
}

function loadPage(page) {
  if (pagesCache[page]) {
    renderCommentsPage(page);
    return;
  }
  var query = commentsQuery().limit(COMMENTS_PER_PAGE);
  if (page > 1) {
    var prev = pagesCache[page - 1];
    if (!prev || !prev.lastDoc) {
      console.error("Cursor manquant pour la page " + page);
      return;
    }
    query = query.startAfter(prev.lastDoc);
  }
  query.get().then(function (snapshot) {
    var docs = [];
    snapshot.forEach(function (doc) { docs.push(doc.data()); });
    pagesCache[page] = {
      docs: docs,
      lastDoc: snapshot.docs.length ? snapshot.docs[snapshot.docs.length - 1] : null
    };
    renderCommentsPage(page);
  }).catch(function (error) {
    console.error("Erreur Firestore :", error);
    document.getElementById("comments-container").innerHTML =
      "<p>Erreur de chargement des commentaires.</p>";
  });
}

// ---- Rendu : création DOM + textContent ----
// textContent est intrinsèquement sûr : aucune injection HTML possible
// (l'échappement manuel n'est pas nécessaire et n'est plus utilisé).
function renderCommentsPage(page) {
  var cached = pagesCache[page];
  if (!cached) return;

  var container = document.getElementById("comments-container");
  container.textContent = "";
  var title = document.createElement("h3");
  title.textContent = "Commentaires";
  container.appendChild(title);

  if (cached.docs.length === 0) {
    var empty = document.createElement("p");
    empty.textContent = "Aucun commentaire pour le moment.";
    container.appendChild(empty);
    renderPaginationControls(page);
    return;
  }

  cached.docs.forEach(function (c) {
    var div = document.createElement("div");
    div.style.borderBottom = "1px solid #ccc";
    div.style.marginBottom = "10px";
    div.style.paddingBottom = "10px";

    var nameEl = document.createElement("strong");
    nameEl.textContent = c.name;
    div.appendChild(nameEl);
    div.appendChild(document.createElement("br"));

    var textEl = document.createElement("p");
    textEl.textContent = c.text;
    div.appendChild(textEl);

    container.appendChild(div);
  });

  renderPaginationControls(page);
}

function renderPaginationControls(page) {
  var controls = document.getElementById("pagination-controls");
  var cached = pagesCache[page];
  if (!cached) return;

  var totalPages = 1;
  if (totalComments !== null) {
    totalPages = Math.max(1, Math.ceil(totalComments / COMMENTS_PER_PAGE));
  }
  // S'il y a une page suivante : la page courante est pleine (index Firestore)
  var hasNext = cached.docs.length === COMMENTS_PER_PAGE && cached.lastDoc !== null;

  if (totalPages <= 1 && !hasNext && page === 1) {
    controls.textContent = "";
    return;
  }

  var html = "";
  if (page > 1) {
    html += '<button id="prev-page">&lt; Précédent</button> ';
  }
  html += "Page " + page;
  if (totalComments !== null) {
    html += " / " + totalPages;
  }
  if (hasNext || (totalComments !== null && page < totalPages)) {
    html += ' <button id="next-page">Suivant &gt;</button>';
  }
  controls.innerHTML = html;

  var prevBtn = document.getElementById("prev-page");
  if (prevBtn) {
    prevBtn.onclick = function () {
      currentPage--;
      loadPage(currentPage);
    };
  }
  var nextBtn = document.getElementById("next-page");
  if (nextBtn) {
    nextBtn.onclick = function () {
      currentPage++;
      loadPage(currentPage);
    };
  }
}

// ---- Envoi d'un commentaire ----
document.getElementById("comment-form").addEventListener("submit", function (e) {
  e.preventDefault();
  var name = document.getElementById("name").value.trim();
  var text = document.getElementById("text").value.trim();
  if (!name || !text) return;
  // Vérification côté client (le serveur/règles Firestore valident aussi)
  if (/[<>]/.test(name) || /[<>]/.test(text)) {
    alert("Les caractères < et > ne sont pas autorisés.");
    return;
  }
  db.collection("comments").doc(pageId).collection("messages").add({
    name: name,
    text: text,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function () {
    document.getElementById("comment-form").reset();
    // Rafraîchir : invalider le cache et recharger la première page
    totalComments = null;
    pagesCache = {};
    currentPage = 1;
    loadPage(1);
    loadTotalComments();
  }).catch(function (error) {
    console.error("Erreur lors de l'envoi :", error);
    alert("Erreur lors de l'envoi du commentaire.");
  });
});

// ---- Initialisation ----
loadPage(1);
loadTotalComments();
</script>
